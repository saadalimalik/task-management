name: task-management

services:
    postgres:
        image: postgres:18.7-alpine
        restart: unless-stopped
        env_file: .env
        ports:
            - '${POSTGRES_PORT}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
            interval: 5s
            timeout: 5s
            retries: 10

    # Applies pending migrations, then exits. Runs from the build stage, which carries the Prisma CLI.
    api-migrate:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: build
        working_dir: /repo/apps/api
        command: ['pnpm', 'db:deploy']
        env_file: apps/api/.env
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
        depends_on:
            postgres:
                condition: service_healthy

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: runtime
        restart: unless-stopped
        env_file: apps/api/.env
        environment:
            NODE_ENV: production
            PORT: 3000
            DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
        ports:
            - '${API_PORT}:3000'
        depends_on:
            api-migrate:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        restart: unless-stopped
        env_file: apps/web/.env
        environment:
            NODE_ENV: production
            PORT: 3000
            API_URL: http://api:3000
        ports:
            - '${WEB_PORT}:3000'
        depends_on:
            api:
                condition: service_healthy

volumes:
    postgres-data:
