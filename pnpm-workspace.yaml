packages:
    - 'apps/*'
    - 'packages/*'

minimumReleaseAgeExclude:
    - express-rate-limit@8.7.5
    - '@tanstack/react-start-rsc@0.1.68'
    - '@tanstack/react-start@1.169.7'
    - '@tanstack/start-plugin-core@1.172.0'
    - '@testing-library/jest-dom@8.0.0'
    - '@testing-library/user-event@14.6.13'

savePrefix: ''

allowBuilds:
    '@prisma/engines': true
    prisma: true
    esbuild: true
    '@scarf/scarf': false
